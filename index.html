<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAJOMS GROUP</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: #fff; color: #404042; }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; border: none; font-family: 'Montserrat', sans-serif; }
    a { text-decoration: none; color: inherit; }
    input, textarea, select { font-family: 'Inter', sans-serif; outline: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f3f4f6; }
    ::-webkit-scrollbar-thumb { background: #D9DCE2; border-radius: 2px; }

    /* ── RESPONSIVE BASE ── */
    @media (max-width: 1024px) {
      body { font-size: 14px; }
    }

    @media (max-width: 768px) {
      body { font-size: 13px; }
    }

    @media (max-width: 480px) {
      body { font-size: 12px; }
    }

    /* Floating label animation */
    .label-tag {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 56px;
      border-radius: 3px 3px 3px 3px;
      cursor: pointer;
      transition: width 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
      overflow: visible;
      white-space: nowrap;
      border: none;
      box-shadow: none;
      background: transparent !important;
    }
    .label-tag:hover { width: 110px; box-shadow: 0 6px 24px rgba(0,0,0,0.15); }
    .label-tag::before {
      content: '';
      position: absolute;
      top: -8px; left: 50%; transform: translateX(-50%);
      width: 10px; height: 8px;
      background: inherit;
      border-radius: 2px 2px 0 0;
    }
    .label-tag::after {
      content: '';
      position: absolute;
      top: -12px; left: 50%; transform: translateX(-50%);
      width: 2px; height: 12px;
      background: #ccc;
    }
    .label-letter { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; flex-shrink: 0; transition: opacity 0.2s, width 0.2s; }
    .label-word { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0; width: 0; transition: opacity 0.25s 0.1s, width 0.35s; overflow: hidden; }
    .label-tag:hover .label-letter { opacity: 0; width: 0; overflow: hidden; font-size: 0; }
    .label-tag:hover .label-word { opacity: 1; width: 70px; }
    .label-active { box-shadow: none; }

    /* ── RESPONSIVE MOBILE ── */
    @media (max-width: 1024px) {
      header { padding: 0 24px; }
      nav { gap: 20px; }
      nav button { font-size: 11px; }
      section { padding: 60px 24px !important; }
      h1 { font-size: 40px; }
      h2 { font-size: 28px; }
    }

    @media (max-width: 768px) {
      header { flex-wrap: wrap; height: auto; }
      nav { width: 100%; flex-direction: row; gap: 8px; margin-top: 8px; }
      nav button { font-size: 10px; padding: 6px 10px; flex: 1; }
      
      .label-tag {
        position: fixed;
        right: 12px;
        bottom: 20px;
        width: 32px;
        height: 48px;
      }
      .label-tag:hover { width: 90px; }
      
      section { padding: 48px 20px !important; }
      h1 { font-size: 32px; }
      h2 { font-size: 24px; }
      .subtitle { font-size: 16px; }
      .body-text { font-size: 13px; }
    }

    @media (max-width: 480px) {
      body { font-family: 'Inter', sans-serif; }
      
      header { padding: 8px 12px; }
      header div { padding: 0; height: auto; display: flex; flex-direction: column; }
      header div > div:first-child { width: 100%; }
      header div > div:first-child img { height: 28px; }
      
      nav { 
        width: 100%;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }
      nav button { 
        width: 100%;
        font-size: 9px;
        padding: 8px 10px;
      }

      .label-tag {
        position: fixed;
        right: 8px;
        bottom: 16px;
        width: 28px;
        height: 44px;
      }
      .label-tag:hover { width: 80px; bottom: 20px; }
      .label-letter { font-size: 12px; }
      .label-word { width: 50px; font-size: 9px; }

      section { padding: 36px 16px !important; }
      
      h1 { font-size: 24px; margin-bottom: 12px; line-height: 1.15; }
      h2 { font-size: 20px; margin-bottom: 10px; }
      h3 { font-size: 13px; }
      h4 { font-size: 11px; }

      .subtitle { font-size: 14px; margin-bottom: 16px; }
      .body-text { font-size: 12px; margin-bottom: 10px; line-height: 1.6; }
      .tagline { font-size: 11px; }

      button { 
        padding: 10px 14px; 
        font-size: 11px;
      }

      input, textarea, select { padding: 10px 10px; font-size: 12px; }

      footer { padding: 32px 16px 20px !important; }
      footer h4 { font-size: 10px; }
      footer p { font-size: 11px; }
    }

    @media (max-width: 360px) {
      h1 { font-size: 20px; }
      h2 { font-size: 18px; }
      section { padding: 28px 12px !important; }
      button { padding: 8px 10px; font-size: 10px; }
      .label-tag { width: 24px; height: 40px; }
      .label-tag:hover { width: 70px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── PALETA BASE ──────────────────────────────────────────────────────────────
const BASE = {
  carbon: '#404042',
  carbonLight: '#6b6b6d',
  grisClaro: '#F3F4F6',
  grisMedio: '#D9DCE2',
  blanco: '#FFFFFF',
};

const ACCENT_SCHEMES = {
  rosa:  { accent: '#FF81A0', accentDark: '#e06080', label: 'Women',  letter: 'W', bg: '#fff0f4', logoFilter: 'none' },
  azul:  { accent: '#5B9BD5', accentDark: '#3a7ab5', label: 'Men',    letter: 'M', bg: '#f0f5ff', logoFilter: 'hue-rotate(228deg) saturate(1.1)' },
  gris:  { accent: '#8C8A86', accentDark: '#6a6864', label: 'Unisex', letter: 'U', bg: '#f4f4f3', logoFilter: 'saturate(0) brightness(0.88)' },
};

// ─── SHARED COMPONENTS ────────────────────────────────────────────────────────
const Logo = ({ size = 44, inverted = false, accent }) => (
  <img
    src="assets/DAJOMSlogo.png"
    alt="DAJOMS GROUP"
    style={{
      height: size,
      width: 'auto',
      filter: inverted
        ? 'brightness(0) invert(1)'
        : (accent?.logoFilter || 'none'),
      transition: 'filter 0.4s ease',
    }}
  />
);

const Btn = ({ children, onClick, variant = 'primary', style = {}, accent }) => {
  const [hover, setHover] = useState(false);
  const isPrimary = variant === 'primary';
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background: isPrimary ? (hover ? accent?.accentDark || '#e06080' : accent?.accent || '#FF81A0') : 'transparent',
        color: isPrimary ? '#fff' : (hover ? (accent?.accent || '#FF81A0') : BASE.carbon),
        border: isPrimary ? 'none' : `1.5px solid ${hover ? (accent?.accent || '#FF81A0') : BASE.carbon}`,
        padding: '14px 32px',
        borderRadius: 4,
        fontWeight: 600,
        fontSize: 14,
        letterSpacing: '0.06em',
        fontFamily: 'Montserrat, sans-serif',
        transition: 'all 0.2s',
        cursor: 'pointer',
        ...style,
      }}
    >{children}</button>
  );
};

const LineaAcento = ({ width = 48, accent, style = {} }) => (
  <div style={{ width, height: 3, background: accent?.accent || '#FF81A0', borderRadius: 2, ...style }} />
);

// Photo mapping: link code to photo key
const PHOTO_MAP = {
  w1: 'w1', w2: 'w2', w3: 'w3', w4: 'w4',
  p1: 'p1', p2: 'p2', p3: 'p3', p4: 'p4', p5: 'p5', p6: 'p6',
  c1: 'c1', c2: 'c2', c3: 'c3', c4: 'c4', c5: 'c5', c6: 'c6',
};

// Get photo suffix by accent
const getPhotoSuffix = (accentKey) => {
  const map = { rosa: 'women_pink', azul: 'men_blue', gris: 'unisex_gray' };
  return map[accentKey] || 'women_pink';
};

const PhotoImg = ({ code, width = '100%', height = 280, style = {}, accentKey = 'rosa' }) => {
  const suffix = getPhotoSuffix(accentKey);
  const src = `assets/photos/${code}_${suffix}.jpg`;
  return (
    <img src={src} alt={code} style={{ width, height, objectFit: 'cover', objectPosition: 'center', borderRadius: 2, display: 'block', ...style }} />
  );
};

const ImgPlaceholder = ({ label, width = '100%', height = 280, style = {}, code = null, accentKey = 'rosa' }) => {
  // If code provided, show real photo; otherwise show placeholder
  if (code) {
    return <PhotoImg code={code} width={width} height={height} style={style} accentKey={accentKey} />;
  }
  return (
    <div style={{
      width, height,
      background: `repeating-linear-gradient(45deg,${BASE.grisClaro},${BASE.grisClaro} 6px,#e8e9eb 6px,#e8e9eb 12px)`,
      display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: 2, ...style,
    }}>
      <span style={{ fontFamily: 'monospace', fontSize: 11, color: BASE.carbonLight, textAlign: 'center', padding: 16, lineHeight: 1.6 }}>{label}</span>
    </div>
  );
};

// ─── FLOATING LABEL SWITCHER ──────────────────────────────────────────────────
const FloatingLabels = ({ accentKey, setAccentKey }) => {
  const botonMap = { rosa: 'assets/boton_women.png', azul: 'assets/boton_men.png', gris: 'assets/boton_unisex.png' };
  
  return (
    <div style={{
      position: 'fixed',
      right: 0,
      top: '50%',
      transform: 'translateY(-50%)',
      zIndex: 900,
      display: 'flex',
      flexDirection: 'column',
      gap: 16,
      paddingRight: 12,
      paddingTop: 24,
    }}>
      {Object.entries(ACCENT_SCHEMES).map(([key, scheme]) => {
        const isActive = accentKey === key;
        return (
          <div
            key={key}
            onClick={() => setAccentKey(key)}
            title={scheme.label}
            style={{
              cursor: 'pointer',
              width: 72,
              height: 110,
              borderRadius: 4,
              overflow: 'hidden',
              border: 'none',
              background: 'transparent',
              boxShadow: isActive 
                ? `0 8px 24px rgba(0,0,0,0.2)` 
                : '0 4px 16px rgba(0,0,0,0.15)',
              transition: 'all 0.25s cubic-bezier(0.34,1.56,0.64,1)',
              transform: isActive ? 'scale(1.12) translateX(-8px)' : 'scale(1)',
            }}
          >
            <img src={botonMap[key]} alt={scheme.label} style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center', display: 'block' }} />
          </div>
        );
      })}
    </div>
  );
};

// ─── NAV ──────────────────────────────────────────────────────────────────────
const Nav = ({ pagina, setPagina, accent }) => {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const links = [
    { id: 'home', label: 'Inicio' },
    { id: 'productos', label: 'Productos' },
    { id: 'nosotros', label: 'Nosotros' },
    { id: 'contacto', label: 'Contacto' },
  ];

  const handleNav = (id) => { setPagina(id); window.scrollTo(0,0); };

  return (
    <header style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 800,
      background: scrolled ? 'rgba(255,255,255,0.97)' : '#fff',
      borderBottom: `1px solid ${scrolled ? BASE.grisMedio : 'transparent'}`,
      backdropFilter: scrolled ? 'blur(8px)' : 'none',
      transition: 'all 0.3s',
    }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 40px', height: 72, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ cursor: 'pointer' }} onClick={() => handleNav('home')}><Logo size={44} accent={accent} /></div>
        <nav style={{ display: 'flex', gap: 36, alignItems: 'center' }}>
          {links.map(l => (
            <button key={l.id} onClick={() => handleNav(l.id)} style={{
              background: 'none', border: 'none',
              fontFamily: 'Montserrat, sans-serif', fontSize: 12, fontWeight: 700,
              letterSpacing: '0.09em', textTransform: 'uppercase',
              color: pagina === l.id ? accent.accent : BASE.carbon,
              borderBottom: pagina === l.id ? `2px solid ${accent.accent}` : '2px solid transparent',
              padding: '4px 0', transition: 'all 0.2s', cursor: 'pointer',
            }}>{l.label}</button>
          ))}
          <Btn onClick={() => handleNav('contacto')} style={{ padding: '10px 22px', fontSize: 12 }} accent={accent}>Solicitar cotización</Btn>
        </nav>
      </div>
    </header>
  );
};

// ─── FOOTER ───────────────────────────────────────────────────────────────────
const Footer = ({ setPagina, accent }) => (
  <footer style={{ background: BASE.carbon, color: '#fff', padding: '64px 40px 32px' }}>
    <div style={{ maxWidth: 1200, margin: '0 auto' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 1fr', gap: 48, marginBottom: 48 }}>
        <div>
          <Logo size={40} inverted />
          <p style={{ fontSize: 13, lineHeight: 1.9, color: 'rgba(255,255,255,0.55)', maxWidth: 280, marginTop: 20 }}>
            Etiquetas para ropa y soluciones de identidad textil. La firma textil que da identidad a cada prenda.
          </p>
        </div>
        <div>
          <h4 style={{ fontFamily: 'Montserrat', fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: accent.accent, marginBottom: 18 }}>Productos</h4>
          {['Etiquetas tejidas','Etiquetas impresas','Etiquetas satinadas','Hang Tags','Heat Transfers','Personalizadas'].map(p => (
            <p key={p} style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 9, cursor: 'pointer' }}>{p}</p>
          ))}
        </div>
        <div>
          <h4 style={{ fontFamily: 'Montserrat', fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: accent.accent, marginBottom: 18 }}>Empresa</h4>
          {['Inicio','Productos','Nosotros','Contacto'].map(p => (
            <p key={p} style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 9, cursor: 'pointer' }}>{p}</p>
          ))}
        </div>
        <div>
          <h4 style={{ fontFamily: 'Montserrat', fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: accent.accent, marginBottom: 18 }}>Contacto</h4>
          <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 9 }}>contacto@dajoms.com</p>
          <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 9 }}>+52 (55) 0000-0000</p>
          <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 18 }}>Lun–Vie 9:00–18:00</p>
          <div style={{ background: '#25D366', borderRadius: 4, padding: '10px 18px', fontSize: 12, fontFamily: 'Montserrat', fontWeight: 700, display: 'inline-block', cursor: 'pointer', color: '#fff' }}>WhatsApp</div>
        </div>
      </div>
      <div style={{ borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: 22, display: 'flex', justifyContent: 'space-between' }}>
        <p style={{ fontSize: 12, color: 'rgba(255,255,255,0.3)' }}>© 2026 DAJOMS GROUP. Todos los derechos reservados.</p>
        <p style={{ fontSize: 12, color: 'rgba(255,255,255,0.3)' }}>Identidad textil para marcas que cuidan cada detalle.</p>
      </div>
    </div>
  </footer>
);

// ─── HOME ─────────────────────────────────────────────────────────────────────
const PaginaHome = ({ setPagina, accent, accentKey }) => {
  const productos = [
    { nombre: 'Etiquetas tejidas', desc: 'Alta definición en hilo jacquard' },
    { nombre: 'Etiquetas impresas', desc: 'Nitidez y versatilidad total' },
    { nombre: 'Hang Tags', desc: 'Presentación de colección' },
    { nombre: 'Heat Transfers', desc: 'Sin costura, acabado premium' },
  ];
  const clientes = ['Cuidado con el Perro','Mala Hierba','KIDS','Coppel','Marca E','Marca F'];
  const valores = [
    { n:'01', t:'Precisión técnica', d:'Cada etiqueta se produce con estándares que garantizan consistencia desde el primer lote hasta el último.' },
    { n:'02', t:'Identidad de marca', d:'Convertimos los detalles de tu prenda en una herramienta de posicionamiento que comunica profesionalismo.' },
    { n:'03', t:'Atención comercial', d:'Acompañamos cada proyecto con comunicación clara, plazos definidos y disposición total para el detalle.' },
  ];

  return (
    <div>
      {/* HERO */}
      <section style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', paddingTop: 72, background: BASE.blanco }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', padding: '80px 40px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'center' }}>
          <div>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10, background: BASE.grisClaro, borderRadius: 40, padding: '8px 18px', marginBottom: 32 }}>
              <div style={{ width: 7, height: 7, borderRadius: '50%', background: accent.accent }} />
              <span style={{ fontFamily: 'Montserrat', fontSize: 10, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: BASE.carbonLight }}>Identidad textil profesional</span>
            </div>
            <h1 style={{ fontFamily: 'Montserrat', fontSize: 50, fontWeight: 800, lineHeight: 1.1, color: BASE.carbon, marginBottom: 24, textWrap: 'pretty' }}>
              Etiquetas que elevan la identidad de tu marca
            </h1>
            <LineaAcento accent={accent} style={{ marginBottom: 28 }} />
            <p style={{ fontSize: 16, lineHeight: 1.85, color: BASE.carbonLight, marginBottom: 40, maxWidth: 460 }}>
              En DAJOMS GROUP desarrollamos etiquetas para ropa y soluciones de identidad textil para marcas, fabricantes y empresas que buscan calidad, precisión y una presentación impecable.
            </p>
            <div style={{ display: 'flex', gap: 16 }}>
              <Btn onClick={() => setPagina('contacto')} accent={accent}>Solicitar cotización</Btn>
              <Btn variant="secondary" onClick={() => setPagina('productos')} accent={accent}>Ver catálogo</Btn>
            </div>
          </div>
          <div style={{ position: 'relative' }}>
            <ImgPlaceholder code="w1" height={460} accentKey={accentKey} style={{ borderRadius: 4 }} />
            <div style={{ position: 'absolute', bottom: -20, left: -20, background: '#fff', border: `1px solid ${BASE.grisMedio}`, borderRadius: 4, padding: '18px 24px', boxShadow: '0 8px 32px rgba(0,0,0,0.07)' }}>
              <div style={{ fontFamily: 'Montserrat', fontSize: 26, fontWeight: 800, color: BASE.carbon }}>+500</div>
              <div style={{ fontFamily: 'Inter', fontSize: 12, color: BASE.carbonLight, marginTop: 2 }}>marcas atendidas</div>
            </div>
            <div style={{ position: 'absolute', top: 20, right: -20, background: accent.accent, borderRadius: 4, padding: '14px 18px' }}>
              <div style={{ fontFamily: 'Montserrat', fontSize: 20, fontWeight: 800, color: '#fff' }}>15+</div>
              <div style={{ fontFamily: 'Inter', fontSize: 11, color: 'rgba(255,255,255,0.85)', marginTop: 2 }}>años de experiencia</div>
            </div>
          </div>
        </div>
      </section>

      {/* CLIENTES */}
      <section style={{ background: BASE.grisClaro, padding: '36px 40px' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <p style={{ textAlign: 'center', fontFamily: 'Montserrat', fontSize: 10, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: BASE.carbonLight, marginBottom: 24 }}>Marcas que confían en DAJOMS GROUP</p>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 48, flexWrap: 'wrap', alignItems: 'center' }}>
            {clientes.map(c => <div key={c} style={{ fontFamily: 'Montserrat', fontSize: 13, fontWeight: 700, color: BASE.grisMedio, letterSpacing: '0.07em' }}>{c}</div>)}
          </div>
        </div>
      </section>

      {/* PROPUESTA DE VALOR */}
      <section style={{ padding: '96px 40px', background: BASE.blanco }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ textAlign: 'center', marginBottom: 60 }}>
            <p style={{ fontFamily: 'Montserrat', fontSize: 10, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent.accent, marginBottom: 14 }}>Por qué elegirnos</p>
            <h2 style={{ fontFamily: 'Montserrat', fontSize: 34, fontWeight: 800, color: BASE.carbon }}>Soluciones textiles con precisión,<br />presencia y valor de marca</h2>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 36 }}>
            {valores.map((v,i) => (
              <div key={i} style={{ padding: '36px 32px', border: `1px solid ${BASE.grisMedio}`, borderRadius: 4, borderTop: `3px solid ${accent.accent}` }}>
                <div style={{ fontFamily: 'Montserrat', fontSize: 28, fontWeight: 800, color: BASE.grisClaro, marginBottom: 16 }}>{v.n}</div>
                <h3 style={{ fontFamily: 'Montserrat', fontSize: 17, fontWeight: 700, color: BASE.carbon, marginBottom: 12 }}>{v.t}</h3>
                <p style={{ fontSize: 14, lineHeight: 1.8, color: BASE.carbonLight }}>{v.d}</p>
              </div>
            ))}
          </div>

// ─── APP ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [pagina, setPaginaRaw] = useState(() => localStorage.getItem('dajoms_page') || 'home');
  const [accentKey, setAccentKeyRaw] = useState(() => localStorage.getItem('dajoms_accent') || 'rosa');
  const [tweaksVisible, setTweaksVisible] = useState(false);

  const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
    "accentColor": "#8C8A86",
    "heroSize": 50,
    "showClientes": true
  }/*EDITMODE-END*/;

  const accent = ACCENT_SCHEMES[accentKey] || ACCENT_SCHEMES.rosa;

  const setPagina = (p) => { localStorage.setItem('dajoms_page', p); setPaginaRaw(p); window.scrollTo({ top: 0 }); };
  const setAccentKey = (k) => {
    localStorage.setItem('dajoms_accent', k);
    setAccentKeyRaw(k);
    const s = ACCENT_SCHEMES[k];
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: s.accent } }, '*');
  };

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const renderPage = () => {
    switch(pagina) {
      case 'home': return <PaginaHome setPagina={setPagina} accent={accent} accentKey={accentKey} />;
      case 'productos': return <PaginaProductos setPagina={setPagina} accent={accent} accentKey={accentKey} />;
      case 'nosotros': return <PaginaNosotros setPagina={setPagina} accent={accent} accentKey={accentKey} />;
      case 'contacto': return <PaginaContacto accent={accent} />;
      default: return <PaginaHome setPagina={setPagina} accent={accent} accentKey={accentKey} />;
    }
  };

  return (
    <div style={{ minHeight: '100vh' }}>
      <Nav pagina={pagina} setPagina={setPagina} accent={accent} />
      <FloatingLabels accentKey={accentKey} setAccentKey={setAccentKey} />
      <main>{renderPage()}</main>
      <Footer setPagina={setPagina} accent={accent} />

      {/* TWEAKS */}
      {tweaksVisible && (
        <div style={{ position:'fixed', bottom:24, right:80, background:'#fff', border:`1px solid ${BASE.grisMedio}`, borderRadius:8, padding:24, boxShadow:'0 8px 40px rgba(0,0,0,0.12)', zIndex:9999, width:240 }}>
          <h3 style={{ fontFamily:'Montserrat', fontSize:12, fontWeight:700, color:BASE.carbon, marginBottom:18, letterSpacing:'0.06em' }}>Tweaks</h3>
          <p style={{ fontFamily:'Montserrat', fontSize:10, fontWeight:600, color:BASE.carbonLight, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:10 }}>Color acento</p>
          <div style={{ display:'flex', gap:8 }}>
            {Object.entries(ACCENT_SCHEMES).map(([key, s]) => (
              <div key={key} onClick={() => setAccentKey(key)} title={s.label} style={{ width:32, height:32, borderRadius:'50%', background:s.accent, cursor:'pointer', border: accentKey===key ? `3px solid ${BASE.carbon}` : '3px solid transparent', transition:'border 0.15s' }} />
            ))}
          </div>
          <p style={{ fontFamily:'Montserrat', fontSize:10, marginTop:16, color:BASE.carbonLight }}>O usa las etiquetas W/M/U flotantes a la derecha.</p>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
