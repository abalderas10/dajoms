<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAJOMS GROUP</title>
  <meta name="description" content="DAJOMS GROUP · Etiquetas tejidas, impresas y soluciones de identidad textil para marcas, fabricantes y empresas." />
  <link rel="canonical" href="https://dajoms.com/" />
  <meta property="og:site_name" content="DAJOMS GROUP" />
  <meta property="og:title" content="DAJOMS GROUP" />
  <meta property="og:description" content="Etiquetas y soluciones de identidad textil para marcas, fabricantes y empresas." />
  <meta property="og:url" content="https://dajoms.com/" />
  <meta property="og:type" content="website" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: #fff; color: #404042; }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; border: none; font-family: 'Montserrat', sans-serif; }
    a { text-decoration: none; color: inherit; }
    input, textarea, select { font-family: 'Inter', sans-serif; outline: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f3f4f6; }
    ::-webkit-scrollbar-thumb { background: #D9DCE2; border-radius: 2px; }

    /* ── RESPONSIVE BASE ── */
    @media (max-width: 1024px) {
      body { font-size: 14px; }
    }

    @media (max-width: 768px) {
      body { font-size: 13px; }
    }

    @media (max-width: 480px) {
      body { font-size: 12px; }
    }

    /* ── RESPONSIVE MOBILE ── */
    @media (max-width: 1024px) {
      header { padding: 0 24px; }
      nav { gap: 20px; }
      nav button { font-size: 11px; }
      section { padding: 60px 24px !important; }
      h1 { font-size: 40px; }
      h2 { font-size: 28px; }
    }

    @media (max-width: 768px) {
      header { flex-wrap: wrap; height: auto; }
      nav { width: 100%; flex-direction: row; gap: 8px; margin-top: 8px; }
      nav button { font-size: 10px; padding: 6px 10px; flex: 1; }
      
      section { padding: 48px 20px !important; }
      h1 { font-size: 32px; }
      h2 { font-size: 24px; }
      .subtitle { font-size: 16px; }
      .body-text { font-size: 13px; }
    }

    @media (max-width: 480px) {
      body { font-family: 'Inter', sans-serif; }
      
      header { padding: 8px 12px; }
      header div { padding: 0; height: auto; display: flex; flex-direction: column; }
      header div > div:first-child { width: 100%; }
      header div > div:first-child img { height: 28px; }
      
      nav { 
        width: 100%;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }
      nav button { 
        width: 100%;
        font-size: 9px;
        padding: 8px 10px;
      }

      section { padding: 36px 16px !important; }
      
      h1 { font-size: 24px; margin-bottom: 12px; line-height: 1.15; }
      h2 { font-size: 20px; margin-bottom: 10px; }
      h3 { font-size: 13px; }
      h4 { font-size: 11px; }

      .subtitle { font-size: 14px; margin-bottom: 16px; }
      .body-text { font-size: 12px; margin-bottom: 10px; line-height: 1.6; }
      .tagline { font-size: 11px; }

      button { 
        padding: 10px 14px; 
        font-size: 11px;
      }

      input, textarea, select { padding: 10px 10px; font-size: 12px; }

      footer { padding: 32px 16px 20px !important; }
      footer h4 { font-size: 10px; }
      footer p { font-size: 11px; }
    }

    @media (max-width: 360px) {
      h1 { font-size: 20px; }
      h2 { font-size: 18px; }
      section { padding: 28px 12px !important; }
      button { padding: 8px 10px; font-size: 10px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── PALETA BASE ──────────────────────────────────────────────────────────────
const BASE = {
  carbon: '#404042',
  carbonLight: '#6b6b6d',
  grisClaro: '#F3F4F6',
  grisMedio: '#D9DCE2',
  blanco: '#FFFFFF',
};

const ACCENT_SCHEMES = {
  azul:  { accent: '#5B9BD5', accentDark: '#3a7ab5', label: 'Men',    letter: 'M', bg: '#f0f5ff', logoFilter: 'hue-rotate(228deg) saturate(1.1)' },
  rosa:  { accent: '#FF81A0', accentDark: '#e06080', label: 'Women',  letter: 'W', bg: '#fff0f4', logoFilter: 'none' },
};

// ─── SHARED COMPONENTS ────────────────────────────────────────────────────────
const Logo = ({ size = 44, inverted = false, accent }) => (
  <img
    src="assets/DAJOMSlogo.png"
    alt="DAJOMS GROUP"
    style={{
      height: size,
      width: 'auto',
      filter: inverted
        ? 'brightness(0) invert(1)'
        : (accent?.logoFilter || 'none'),
      transition: 'filter 0.4s ease',
    }}
  />
);

const Btn = ({ children, onClick, variant = 'primary', style = {}, accent }) => {
  const [hover, setHover] = useState(false);
  const isPrimary = variant === 'primary';
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background: isPrimary ? (hover ? accent?.accentDark || '#e06080' : accent?.accent || '#FF81A0') : 'transparent',
        color: isPrimary ? '#fff' : (hover ? (accent?.accent || '#FF81A0') : BASE.carbon),
        border: isPrimary ? 'none' : `1.5px solid ${hover ? (accent?.accent || '#FF81A0') : BASE.carbon}`,
        padding: '14px 32px',
        borderRadius: 4,
        fontWeight: 600,
        fontSize: 14,
        letterSpacing: '0.06em',
        fontFamily: 'Montserrat, sans-serif',
        transition: 'all 0.2s',
        cursor: 'pointer',
        ...style,
      }}
    >{children}</button>
  );
};

const LineaAcento = ({ width = 48, accent, style = {} }) => (
  <div style={{ width, height: 3, background: accent?.accent || '#FF81A0', borderRadius: 2, ...style }} />
);

// Photo mapping: link code to photo key
const PHOTO_MAP = {
  w1: 'w1', w2: 'w2', w3: 'w3', w4: 'w4',
  p1: 'p1', p2: 'p2', p3: 'p3', p4: 'p4', p5: 'p5', p6: 'p6',
  c1: 'c1', c2: 'c2', c3: 'c3', c4: 'c4', c5: 'c5', c6: 'c6_custom',
};

// Get photo suffix by accent
const getPhotoSuffix = (accentKey) => {
  const map = { rosa: 'women_pink', azul: 'men_blue' };
  return map[accentKey] || 'men_blue';
};

const PhotoImg = ({ code, width = '100%', height = 280, style = {}, accentKey = 'azul' }) => {
  // Special handling for custom solutions (c5 - last product, uses c6 photos locally)
  if (code === 'c5') {
    const suffix = accentKey === 'rosa' ? 'women_pink' : 'men_blue';
    const src = `assets/photos/c6_${suffix}.jpg`;
    return (
      <img src={src} alt={code} style={{ width, height, objectFit: 'cover', objectPosition: 'center', borderRadius: 2, display: 'block', ...style }} />
    );
  }
  
  const suffix = getPhotoSuffix(accentKey);
  const src = `assets/photos/${code}_${suffix}.jpg`;
  return (
    <img src={src} alt={code} style={{ width, height, objectFit: 'cover', objectPosition: 'center', borderRadius: 2, display: 'block', ...style }} />
  );
};

const ImgPlaceholder = ({ label, width = '100%', height = 280, style = {}, code = null, accentKey = 'azul' }) => {
  // If code provided, show real photo; otherwise show placeholder
  if (code) {
    return <PhotoImg code={code} width={width} height={height} style={style} accentKey={accentKey} />;
  }
  return (
    <div style={{
      width, height,
      background: `repeating-linear-gradient(45deg,${BASE.grisClaro},${BASE.grisClaro} 6px,#e8e9eb 6px,#e8e9eb 12px)`,
      display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: 2, ...style,
    }}>
      <span style={{ fontFamily: 'monospace', fontSize: 11, color: BASE.carbonLight, textAlign: 'center', padding: 16, lineHeight: 1.6 }}>{label}</span>
    </div>
  );
};

// ─── PRODUCT CAROUSEL — Walking Gallery ─────────────────────────────────────
const ProductCarousel = ({ accent }) => {
  const [offset, setOffset] = useState(0);
  const [paused, setPaused] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [cardW, setCardW] = useState(340);
  const [isDragging, setIsDragging] = useState(false);
  const trackRef = React.useRef(null);
  const containerRef = React.useRef(null);
  const dragRef = React.useRef({ active: false, startX: 0, startOffset: 0, lastX: 0, moved: 0 });

  const items = [
    { src: 'assets/products/p01.jpg', cliente: 'Cuidado con el Perro', tipo: 'Etiqueta tejida' },
    { src: 'assets/products/p02.jpg', cliente: 'CCP Kids', tipo: 'Etiqueta satinada' },
    { src: 'assets/products/p03.jpg', cliente: 'Malayerba', tipo: 'Etiqueta tejida' },
    { src: 'assets/products/p04.jpg', cliente: 'MY', tipo: 'Etiqueta impresa' },
    { src: 'assets/products/p05.jpg', cliente: 'CCP — Baggy', tipo: 'Hang Tag' },
    { src: 'assets/products/p06.jpg', cliente: 'Cuidado con el Perro — Loose', tipo: 'Hang Tag' },
    { src: 'assets/products/p07.jpg', cliente: 'Malayerba', tipo: 'Hang Tag' },
    { src: 'assets/products/p09.jpg', cliente: 'CCP Kids', tipo: 'Hang Tags' },
    { src: 'assets/products/p10.jpg', cliente: 'JBE', tipo: 'Etiqueta tejida' },
  ];

  // Triplicate for seamless infinite loop
  const loop = [...items, ...items, ...items];
  const cardGap = 24;
  const cardStep = cardW + cardGap;

  // Responsive card width
  useEffect(() => {
    const measure = () => {
      const w = containerRef.current?.offsetWidth || 1200;
      if (w < 640) setCardW(Math.min(w - 64, 280));
      else if (w < 960) setCardW(280);
      else setCardW(320);
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);

  // Continuous gentle walking animation
  useEffect(() => {
    if (paused || lightbox !== null) return;
    let raf;
    let last = performance.now();
    const speed = 30; // px per second
    const tick = (now) => {
      const dt = (now - last) / 1000;
      last = now;
      setOffset(o => {
        let next = o + speed * dt;
        const cycle = items.length * cardStep;
        if (next >= cycle) next -= cycle;
        return next;
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [paused, lightbox, cardStep, items.length]);

  // Normalize offset to keep it within the loop range
  const normalize = (v) => {
    const cycle = items.length * cardStep;
    let next = v % cycle;
    if (next < 0) next += cycle;
    return next;
  };

  // Mouse drag
  const onMouseDown = (e) => {
    dragRef.current = { active: true, startX: e.clientX, startOffset: offset, lastX: e.clientX, moved: 0 };
    setIsDragging(true);
    setPaused(true);
  };const onMouseMove = (e) => {
    if (!dragRef.current.active) return;
    e.preventDefault();
    const dx = e.clientX - dragRef.current.startX;
    dragRef.current.moved = Math.max(dragRef.current.moved, Math.abs(dx));
    setOffset(normalize(dragRef.current.startOffset - dx));
  };
  const endDrag = () => {
    if (!dragRef.current.active) return;
    dragRef.current.active = false;
    // Keep dragging flag briefly so the click on a card is suppressed
    setTimeout(() => setIsDragging(false), 60);
  };

  // Wheel — convert vertical scroll to horizontal carousel scroll, but only when the user
  // intends a horizontal gesture (shift held, trackpad horizontal, or strong horizontal delta).
  // Otherwise let the page scroll normally.
  const onWheel = (e) => {
    const horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if (!horizontal && !e.shiftKey) return;
    e.preventDefault();
    const delta = horizontal ? e.deltaX : e.deltaY;
    setOffset(o => normalize(o + delta));
    setPaused(true);
    clearTimeout(onWheel._t);
    onWheel._t = setTimeout(() => setPaused(false), 1200);
  };

  // Touch support
  const onTouchStart = (e) => {
    const t = e.touches[0];
    dragRef.current = { active: true, startX: t.clientX, startOffset: offset, lastX: t.clientX, moved: 0 };
    setIsDragging(true);
    setPaused(true);
  };
  const onTouchMove = (e) => {
    if (!dragRef.current.active) return;
    const t = e.touches[0];
    const dx = t.clientX - dragRef.current.startX;
    dragRef.current.moved = Math.max(dragRef.current.moved, Math.abs(dx));
    setOffset(normalize(dragRef.current.startOffset - dx));
  };

  // Keyboard for lightbox
  useEffect(() => {
    if (lightbox === null) return;
    const onKey = (e) => {
      if (e.key === 'Escape') setLightbox(null);
      if (e.key === 'ArrowRight') setLightbox(i => (i + 1) % items.length);
      if (e.key === 'ArrowLeft') setLightbox(i => (i - 1 + items.length) % items.length);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [lightbox, items.length]);

  // Pure soft white matching photo backgrounds
  const PHOTO_BG = '#f3f3f2';

  return (
    <section style={{ background: PHOTO_BG, padding: '88px 0 96px' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 40px', marginBottom: 48 }}>
        <p style={{ fontFamily: 'Montserrat', fontSize: 10, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent.accent, marginBottom: 14 }}>Galería de productos</p>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 32, flexWrap: 'wrap' }}>
          <h2 style={{ fontFamily: 'Montserrat', fontSize: 34, fontWeight: 800, color: BASE.carbon, lineHeight: 1.15, maxWidth: 640 }}>Trabajos reales para marcas reales</h2>
          <p style={{ fontSize: 14, color: BASE.carbonLight, maxWidth: 360, lineHeight: 1.75 }}>Selección de etiquetas, hang tags y aplicaciones desarrolladas en nuestro taller. Haz clic en cualquier pieza para verla en detalle.</p>
        </div>
      </div>

      {/* Walking track */}
      <div 
        ref={containerRef}
        onMouseEnter={() => setPaused(true)}
        onMouseLeave={() => { setPaused(false); endDrag(); }}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={endDrag}
        onWheel={onWheel}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={endDrag}
        style={{ position: 'relative', overflow: 'hidden', padding: '8px 0', cursor: isDragging ? 'grabbing' : 'grab', userSelect: 'none' }}
      >
        {/* Edge fade masks */}
        <div style={{ position: 'absolute', top: 0, bottom: 0, left: 0, width: 120, background: `linear-gradient(90deg, ${PHOTO_BG} 0%, rgba(243,243,242,0) 100%)`, zIndex: 2, pointerEvents: 'none' }} />
        <div style={{ position: 'absolute', top: 0, bottom: 0, right: 0, width: 120, background: `linear-gradient(270deg, ${PHOTO_BG} 0%, rgba(243,243,242,0) 100%)`, zIndex: 2, pointerEvents: 'none' }} />

        <div
          ref={trackRef}
          style={{
            display: 'flex',
            gap: cardGap,
            paddingLeft: 40,
            paddingRight: 40,
            transform: `translateX(-${offset}px)`,
            willChange: 'transform',
          }}
        >
          {loop.map((item, i) => {
            const originalIdx = i % items.length;
            return (
              <button
                key={i}
                draggable={false}
                onClick={(e) => {
                  // Only suppress click if user actually dragged more than 6px
                  if (dragRef.current.moved > 6) {
                    e.preventDefault();
                    return;
                  }
                  setLightbox(originalIdx);
                }}
                style={{
                  flexShrink: 0,
                  width: cardW,
                  height: cardW * 1.15,
                  border: 'none',
                  padding: 0,
                  background: '#fafaf9',
                  borderRadius: 6,
                  overflow: 'hidden',
                  cursor: 'pointer',
                  position: 'relative',
                  transition: 'transform 0.4s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.4s',
                  boxShadow: '0 1px 3px rgba(0,0,0,0.04)',
                }}
                onMouseEnter={e => {
                  e.currentTarget.style.transform = 'translateY(-6px) scale(1.02)';
                  e.currentTarget.style.boxShadow = '0 16px 40px rgba(0,0,0,0.12)';
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.transform = 'translateY(0) scale(1)';
                  e.currentTarget.style.boxShadow = '0 1px 3px rgba(0,0,0,0.04)';
                }}
              >
                <img 
                  src={item.src} 
                  alt={item.cliente}
                  loading="lazy"
                  draggable={false}
                  style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center', display: 'block', pointerEvents: 'none' }}
                />
                {/* Caption overlay */}
                <div style={{
                  position: 'absolute', left: 0, right: 0, bottom: 0,
                  padding: '32px 20px 18px',
                  background: 'linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 70%)',
                  textAlign: 'left',
                }}>
                  <p style={{ fontFamily: 'Montserrat', fontSize: 9, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: accent.accent, marginBottom: 4 }}>{item.tipo}</p>
                  <p style={{ fontFamily: 'Montserrat', fontSize: 13, fontWeight: 700, color: BASE.carbon }}>{item.cliente}</p>
                </div>
                {/* Expand hint */}
                <div style={{
                  position: 'absolute', top: 14, right: 14,
                  width: 32, height: 32, borderRadius: '50%',
                  background: 'rgba(255,255,255,0.92)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 13, color: BASE.carbon, fontWeight: 600,
                  boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
                }}>↗</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Tip */}
      <div style={{ textAlign: 'center', marginTop: 32 }}>
        <p style={{ fontFamily: 'Montserrat', fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: BASE.carbonLight }}>
          {items.length} piezas · arrastra para recorrer · click para ampliar
        </p>
      </div>

      {/* Lightbox */}
      {lightbox !== null && (
        <div
          onClick={() => setLightbox(null)}
          style={{
            position: 'fixed', inset: 0, zIndex: 9999,
            background: 'rgba(20,20,22,0.92)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            padding: 40,
            animation: 'lbFade 0.25s ease-out',
          }}
        >
          <button
            onClick={(e) => { e.stopPropagation(); setLightbox(null); }}
            style={{
              position: 'absolute', top: 24, right: 24,
              width: 44, height: 44, borderRadius: '50%',
              background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)',
              color: '#fff', fontSize: 18, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}
          >✕</button>

          <button
            onClick={(e) => { e.stopPropagation(); setLightbox((lightbox - 1 + items.length) % items.length); }}
            style={{
              position: 'absolute', top: '50%', left: 24, transform: 'translateY(-50%)',
              width: 52, height: 52, borderRadius: '50%',
              background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)',
              color: '#fff', fontSize: 22, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}
          >‹</button>

          <button
            onClick={(e) => { e.stopPropagation(); setLightbox((lightbox + 1) % items.length); }}
            style={{
              position: 'absolute', top: '50%', right: 24, transform: 'translateY(-50%)',
              width: 52, height: 52, borderRadius: '50%',
              background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)',
              color: '#fff', fontSize: 22, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}
          >›</button>

          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              maxWidth: 'min(1100px, 90vw)',
              maxHeight: '88vh',
              display: 'flex', flexDirection: 'column', alignItems: 'center',
              animation: 'lbZoom 0.35s cubic-bezier(0.34,1.4,0.64,1)',
            }}
          >
            <img
              src={items[lightbox].src}
              alt={items[lightbox].cliente}
              style={{
                maxWidth: '100%',
                maxHeight: '76vh',
                objectFit: 'contain',
                borderRadius: 4,
                boxShadow: '0 30px 80px rgba(0,0,0,0.5)',
              }}
            />
            <div style={{ marginTop: 24, textAlign: 'center' }}>
              <p style={{ fontFamily: 'Montserrat', fontSize: 10, fontWeight: 700, letterSpacing: '0.18em', textTransform: 'uppercase', color: accent.accent, marginBottom: 6 }}>{items[lightbox].tipo}</p>
              <p style={{ fontFamily: 'Montserrat', fontSize: 18, fontWeight: 700, color: '#fff' }}>{items[lightbox].cliente}</p>
              <p style={{ fontFamily: 'Montserrat', fontSize: 11, color: 'rgba(255,255,255,0.5)', marginTop: 10, letterSpacing: '0.1em' }}>
                {String(lightbox + 1).padStart(2,'0')} / {String(items.length).padStart(2,'0')}
              </p>
            </div>
          </div>
        </div>
      )}

      <style>{`
        @keyframes lbFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes lbZoom {
          from { opacity: 0; transform: scale(0.94); }
          to { opacity: 1; transform: scale(1); }
        }
      `}</style>
    </section>
  );
};

// ─── ROTATING BACKGROUND ─────────────────────────────────────────────────────
const RotatingBackground = ({ images, interval = 7000, overlay = 0.88 }) => {
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setIdx(i => (i + 1) % images.length), interval);
    return () => clearInterval(t);
  }, [interval, images.length]);

  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', zIndex: 0 }}>
      {images.map((src, i) => (
        <div key={i} style={{
          position: 'absolute', inset: 0,
          backgroundImage: `url(${src})`,
          backgroundSize: 'cover',
          backgroundPosition: 'center',
          opacity: i === idx ? 1 : 0,
          transition: 'opacity 2.4s ease-in-out',
          transform: i === idx ? 'scale(1.04)' : 'scale(1)',
          transitionProperty: 'opacity, transform',
          transitionDuration: '2.4s, 9s',
          transitionTimingFunction: 'ease-in-out, linear',
        }} />
      ))}
      {/* White wash so text stays legible */}
      <div style={{
        position: 'absolute', inset: 0,
        background: `rgba(255,255,255, ${overlay})`,
      }} />
    </div>
  );
};

// ─── APP ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [pagina, setPaginaRaw] = useState(() => localStorage.getItem('dajoms_page') || 'home');
  const [accentKey, setAccentKeyRaw] = useState(() => localStorage.getItem('dajoms_accent') || 'azul');
  const [tweaksVisible, setTweaksVisible] = useState(false);

  const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
    "accentColor": "#5B9BD5",
    "heroSize": 50,
    "showClientes": true
  }/*EDITMODE-END*/;

  const accent = ACCENT_SCHEMES[accentKey] || ACCENT_SCHEMES.azul;

  const setPagina = (p) => { localStorage.setItem('dajoms_page', p); setPaginaRaw(p); window.scrollTo({ top: 0 }); };
  const setAccentKey = (k) => {
    localStorage.setItem('dajoms_accent', k);
    setAccentKeyRaw(k);
    const s = ACCENT_SCHEMES[k];
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: s.accent } }, '*');
  };

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const renderPage = () => {
    switch(pagina) {
      case 'home': return <PaginaHome setPagina={setPagina} accent={accent} accentKey={accentKey} />;
      case 'productos': return <PaginaProductos setPagina={setPagina} accent={accent} accentKey={accentKey} />;
      case 'nosotros': return <PaginaNosotros setPagina={setPagina} accent={accent} accentKey={accentKey} />;
      case 'contacto': return <PaginaContacto accent={accent} />;
      default: return <PaginaHome setPagina={setPagina} accent={accent} accentKey={accentKey} />;
    }
  };

  return (
    <div style={{ minHeight: '100vh' }}>
      <Nav pagina={pagina} setPagina={setPagina} accent={accent} accentKey={accentKey} setAccentKey={setAccentKey} />
      <main>{renderPage()}</main>
      <Footer setPagina={setPagina} accent={accent} />

      {/* TWEAKS */}
      {tweaksVisible && (
        <div style={{ position:'fixed', bottom:24, right:24, background:'#fff', border:`1px solid ${BASE.grisMedio}`, borderRadius:8, padding:24, boxShadow:'0 8px 40px rgba(0,0,0,0.12)', zIndex:9999, width:240 }}>
          <h3 style={{ fontFamily:'Montserrat', fontSize:12, fontWeight:700, color:BASE.carbon, marginBottom:18, letterSpacing:'0.06em' }}>Tweaks</h3>
          <p style={{ fontFamily:'Montserrat', fontSize:10, fontWeight:600, color:BASE.carbonLight, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:10 }}>Color acento</p>
          <div style={{ display:'flex', gap:8 }}>
            {Object.entries(ACCENT_SCHEMES).map(([key, s]) => (
              <div key={key} onClick={() => setAccentKey(key)} title={s.label} style={{ width:32, height:32, borderRadius:'50%', background:s.accent, cursor:'pointer', border: accentKey===key ? `3px solid ${BASE.carbon}` : '3px solid transparent', transition:'border 0.15s' }} />
            ))}
          </div>
          <p style={{ fontFamily:'Montserrat', fontSize:10, marginTop:16, color:BASE.carbonLight }}>O usa los círculos en la navegación.</p>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
